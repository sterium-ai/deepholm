name: Godot headless checks

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  headless:
    # Windows: the save integrity hash is not yet identical across platforms (see README,
    # Known limitations), and Windows is the platform the suite and its fixtures are maintained on.
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          # The console launcher must keep its original name next to the main executable,
          # so expose it through a small "godot" wrapper script instead of renaming it.
          mkdir -p "$RUNNER_TEMP/godot-bin"
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_win64_console.exe" > "$RUNNER_TEMP/godot-bin/godot"
          chmod +x "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/godot-bin/godot" --version

      - name: Validate JSON content, data and schemas
        shell: python
        run: |
          import json
          from pathlib import Path

          roots = ["game/content", "game/data", "docs/architecture"]
          files = sorted(p for root in roots for p in Path(root).rglob("*.json"))
          for path in files:
              with path.open(encoding="utf-8") as source:
                  json.load(source)
          print(f"Validated {len(files)} JSON files")

      - name: Check core file size budgets
        shell: python
        run: |
          import json, sys
          budgets = json.load(open("docs/architecture/core-budgets.json", encoding="utf-8"))
          over = []
          for path, cap in budgets.items():
              if path.startswith("_"):
                  continue
              lines = sum(1 for _ in open(path, encoding="utf-8"))
              print(f"{path}: {lines}/{cap}")
              if lines > cap:
                  over.append(path)
          sys.exit(f"over budget: {over}" if over else 0)

      - name: Lint content literals in the simulation core
        shell: pwsh
        run: ./game/scripts/tests/lint_content_literals.ps1

      # Import first to build the class_name cache the scripts depend on.
      - name: Import Godot project
        run: godot --headless --path game --import

      - name: Headless boot check
        run: godot --headless --path game --quit-after 1

      - name: Run the full headless test suite
        run: bash tools/run_tests.sh godot
